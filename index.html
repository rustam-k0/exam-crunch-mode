<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f4f0">
  <title>Exam Board — Summer 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%232563eb%22/></svg>">
  <style>
    :root {
      --bg: #f4f4f0;
      --card: #ffffff;
      --text: #191919;
      --muted: #74746d;
      --line: #deded8;
      --soft: #eeeeea;
      --blue: #2563eb;
      --red: #ef4444;
      --amber: #eab308;
      --green: #22a447;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 18px 24px 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      background: var(--blue);
      border-radius: 50%;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: -.025em;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .clock {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(210px, .7fr) minmax(260px, 1fr) auto;
      align-items: center;
      gap: 24px;
      min-height: 58px;
      margin: 10px 0 14px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .next {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .next strong {
      font-size: 20px;
      white-space: nowrap;
    }

    .next span {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-wrap { min-width: 0; }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 10px;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      background: var(--soft);
      border-radius: 99px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--blue);
      border-radius: inherit;
      transition: width .3s ease;
    }

    .difficulty-legend {
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .legend-item, .difficulty {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--difficulty);
    }

    .dot.hard, .difficulty.hard { --difficulty: var(--red); }
    .dot.medium, .difficulty.medium { --difficulty: var(--amber); }
    .dot.light, .difficulty.light { --difficulty: var(--green); }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 9px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: -.01em;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .subject-card {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 145px;
      padding: 12px;
      flex-direction: column;
      color: inherit;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .subject-card:hover {
      border-color: #b8b8b0;
      box-shadow: 0 4px 14px rgba(0,0,0,.05);
      transform: translateY(-1px);
    }

    .subject-card:focus-visible {
      outline: 3px solid rgba(37,99,235,.28);
      outline-offset: 2px;
    }

    .subject-card[data-status="preparing"] { background: #fffdf4; }
    .subject-card[data-status="ready"] { background: #f4f7ff; }
    .subject-card[data-status="done"] { background: #f1faf3; border-color: #a8d9b3; }
    .subject-card[data-status="retake"] { background: #fff4f3; border-color: #f0b6b1; }
    .subject-card[data-status="skipped"] { opacity: .58; }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .subject-title {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 7px;
    }

    .subject-title h3 {
      overflow: hidden;
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: -.015em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state {
      flex: 0 0 auto;
      padding: 3px 6px;
      color: var(--muted);
      background: var(--soft);
      border-radius: 5px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 8px 0;
    }

    .tag {
      padding: 2px 6px;
      color: #5f5f59;
      background: #f5f5f2;
      border: 1px solid #e7e7e1;
      border-radius: 5px;
      font-size: 9px;
      line-height: 1.35;
    }

    .milestones {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .milestone {
      display: grid;
      grid-template-columns: 43px minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 6px;
      font-size: 10px;
      line-height: 1.25;
    }

    .milestone time { font-weight: 700; }

    .milestone-name {
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .countdown {
      color: var(--blue);
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    .notes {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 8px;
      margin: auto 0 0;
      padding-top: 8px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.3;
    }

    .note + .note::before {
      content: "·";
      margin-right: 8px;
      color: #b4b4ae;
    }

    .empty-note { visibility: hidden; }

    @media (max-width: 1080px) {
      .app { padding-inline: 18px; }
      .overview { grid-template-columns: minmax(190px, .7fr) minmax(220px, 1fr); }
      .difficulty-legend { grid-column: 1 / -1; justify-content: flex-end; }
      .subject-card { min-height: 151px; }
    }

    @media (max-width: 880px) {
      .subject-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .overview { grid-template-columns: 1fr; gap: 10px; }
      .difficulty-legend { grid-column: auto; justify-content: flex-start; }
    }

    @media (max-width: 560px) {
      .app { padding: 13px 12px 18px; }
      .topbar { align-items: flex-start; }
      .brand h1 { font-size: 18px; }
      .brand p { display: none; }
      .clock { max-width: 130px; font-size: 9px; }
      .overview { margin-top: 7px; padding: 10px; }
      .next strong { font-size: 18px; }
      .subject-grid { grid-template-columns: 1fr; }
      .subject-card { min-height: 139px; }
      .section-head { align-items: flex-start; flex-direction: column; gap: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Exam Board</h1>
          <p>Summer semester 2026 · Berlin</p>
        </div>
      </div>
      <time class="clock" id="current-time">Loading…</time>
    </header>

    <section class="overview" aria-label="Exam overview">
      <div class="next">
        <strong id="next-count">—</strong>
        <span id="next-label">until the next deadline</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-copy"><span id="completion-copy">0 of 11 subjects complete</span><span id="run-copy">0% of exam period</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
      <div class="difficulty-legend" aria-label="Difficulty legend">
        <span class="legend-item"><i class="dot hard"></i>Hard</span>
        <span class="legend-item"><i class="dot medium"></i>Medium</span>
        <span class="legend-item"><i class="dot light"></i>Light</span>
      </div>
    </section>

    <div class="section-head">
      <h2>Subjects & deadlines</h2>
      <p>Every exact date has its own countdown · click a card to change status</p>
    </div>
    <section class="subject-grid" id="subject-grid" aria-label="Subjects"></section>
  </main>

  <script>
    const SUBJECTS = [
      {
        id: "ai1016-presentation", name: "Presentations", difficulty: "light", required: "Mandatory",
        format: "Presentation + project",
        milestones: [
          { date: "2026-06-30", label: "Presentation" },
          { date: "2026-07-13", label: "Project / Exposé" }
        ],
        notes: ["Results: late July"]
      },
      {
        id: "ai1006-programming-2", name: "Programming 2", difficulty: "medium", required: "Mandatory",
        format: "Written exam + testat",
        milestones: [{ date: "2026-07-13", label: "Written exam · room 46.009" }],
        notes: ["Exam 60%", "Testat 40% — full", "No cheat sheet", "No exam bonus"]
      },
      {
        id: "ai1001-methods-2", name: "Methods & Tools 2", difficulty: "light", required: "Mandatory",
        format: "Presentation + project",
        milestones: [{ date: "2026-07-20", label: "Portfolio deadline" }],
        notes: ["Results: August"]
      },
      {
        id: "ai1522-3d", name: "3D Modelling", difficulty: "light", required: "Elective",
        format: "Project",
        milestones: [
          { date: "2026-07-23", label: "Project deadline" },
          { date: "2026-07-25", label: "Results", result: true }
        ],
        notes: []
      },
      {
        id: "ai1051-animation", name: "Animation", difficulty: "light", required: "Elective",
        format: "Project",
        milestones: [
          { date: "2026-07-23", label: "Project deadline" },
          { date: "2026-07-25", label: "Results", result: true }
        ],
        notes: []
      },
      {
        id: "ai1010-algebra", name: "Algebra", difficulty: "hard", required: "Mandatory",
        format: "Written exam",
        milestones: [{ date: "2026-07-24", label: "Exam · room 54.001" }],
        notes: ["Cheat sheet allowed"]
      },
      {
        id: "ai1007-networks", name: "Networks", difficulty: "hard", required: "Mandatory",
        format: "Written exam",
        milestones: [{ date: "2026-07-27", label: "Exam · room 54.001" }],
        notes: []
      },
      {
        id: "ai1009-web-app", name: "Web Applications", difficulty: "hard", required: "Mandatory",
        format: "Project + computer exam",
        milestones: [{ date: "2026-07-29", label: "Submission & exam · 51.103" }],
        notes: ["Cheat sheet on disk allowed", "Results: same day"]
      },
      {
        id: "ai1020-ai-ml", name: "AI / Machine Learning", difficulty: "medium", required: "Elective",
        format: "Written exam",
        milestones: [{ date: "2026-07-29", label: "Exam · room 54.001" }],
        notes: ["Cheat sheet allowed", "+0.6 grade bonus"]
      },
      {
        id: "ai1011-software-engineering", name: "Software Engineering", difficulty: "medium", required: "Mandatory",
        format: "Project + written exam",
        milestones: [
          { date: "2026-07-05", label: "Project deadline" },
          { date: "2026-08-04", label: "Exam · room 54.001" }
        ],
        notes: ["Cheat sheet allowed", "Results: late August"]
      },
      {
        id: "ai1019-graphics", name: "Computer Graphics", difficulty: "light", required: "Elective",
        format: "Project",
        milestones: [{ date: "2026-08-31", label: "Project deadline" }],
        notes: ["Results: late September"]
      }
    ];

    const STATES = ["todo", "preparing", "ready", "done", "retake", "skipped"];
    const STATE_LABELS = { todo: "To do", preparing: "Preparing", ready: "Ready", done: "Done", retake: "Retake", skipped: "Skipped" };
    const DIFFICULTY_LABELS = { hard: "Hard", medium: "Medium", light: "Light" };
    const DAY = 86400000;
    const PERIOD_START = parseDate("2026-06-30");
    const PERIOD_END = parseDate("2026-08-31");

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day, 12);
    }

    function daysFromNow(value, now) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
      return Math.ceil((parseDate(value) - today) / DAY);
    }

    function countdown(value, now) {
      const days = daysFromNow(value, now);
      if (days > 1) return `${days}d`;
      if (days === 1) return "Tomorrow";
      if (days === 0) return "Today";
      return `${Math.abs(days)}d ago`;
    }

    function dateLabel(value) {
      return parseDate(value).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
    }

    function getStatus(id) {
      const current = localStorage.getItem(`semester26_${id}`);
      if (current === "working") return "preparing";
      if (current === "passed") return "done";
      return STATES.includes(current) ? current : "todo";
    }

    function cycleStatus(id) {
      const current = getStatus(id);
      const next = STATES[(STATES.indexOf(current) + 1) % STATES.length];
      localStorage.setItem(`semester26_${id}`, next);
      render();
    }

    function allEvents() {
      return SUBJECTS.flatMap(subject => subject.milestones.map(milestone => ({ ...milestone, subject: subject.name })))
        .sort((a, b) => parseDate(a.date) - parseDate(b.date));
    }

    function renderOverview(now) {
      const next = allEvents().find(event => daysFromNow(event.date, now) >= 0);
      const count = document.getElementById("next-count");
      const label = document.getElementById("next-label");

      if (next) {
        const days = daysFromNow(next.date, now);
        count.textContent = days === 0 ? "Today" : `${days}d`;
        label.textContent = `until ${next.subject} · ${next.label}`;
      } else {
        count.textContent = "Done";
        label.textContent = "the exam period is complete";
      }

      const done = SUBJECTS.filter(subject => getStatus(subject.id) === "done").length;
      const completion = Math.round((done / SUBJECTS.length) * 100);
      const elapsed = Math.max(0, Math.min(100, ((now - PERIOD_START) / (PERIOD_END - PERIOD_START)) * 100));
      document.getElementById("completion-copy").textContent = `${done} of ${SUBJECTS.length} subjects complete`;
      document.getElementById("run-copy").textContent = `${Math.round(elapsed)}% of exam period`;
      document.getElementById("progress-fill").style.width = `${completion}%`;
    }

    function renderCards(now) {
      const grid = document.getElementById("subject-grid");
      grid.innerHTML = "";

      SUBJECTS.forEach(subject => {
        const status = getStatus(subject.id);
        const card = document.createElement("button");
        card.type = "button";
        card.className = "subject-card";
        card.dataset.status = status;
        card.setAttribute("aria-label", `${subject.name}. ${DIFFICULTY_LABELS[subject.difficulty]} difficulty. Status: ${STATE_LABELS[status]}. Click to change.`);
        card.addEventListener("click", () => cycleStatus(subject.id));

        const milestones = subject.milestones.map(milestone => `
          <li class="milestone">
            <time datetime="${milestone.date}">${dateLabel(milestone.date)}</time>
            <span class="milestone-name">${milestone.label}</span>
            <span class="countdown">${countdown(milestone.date, now)}</span>
          </li>`).join("");
        const notes = subject.notes.length
          ? subject.notes.map(note => `<span class="note">${note}</span>`).join("")
          : `<span class="empty-note">No extra notes</span>`;

        card.innerHTML = `
          <div class="card-head">
            <div class="subject-title">
              <span class="difficulty ${subject.difficulty}" title="${DIFFICULTY_LABELS[subject.difficulty]} difficulty"><i class="dot"></i></span>
              <h3>${subject.name}</h3>
            </div>
            <span class="state">${STATE_LABELS[status]}</span>
          </div>
          <div class="tags"><span class="tag">${subject.required}</span><span class="tag">${subject.format}</span></div>
          <ul class="milestones">${milestones}</ul>
          <div class="notes">${notes}</div>`;
        grid.appendChild(card);
      });
    }

    function render() {
      const now = new Date();
      document.getElementById("current-time").textContent = now.toLocaleString("en-GB", {
        weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin"
      }) + " · Berlin";
      renderOverview(now);
      renderCards(now);
    }

    render();
    setInterval(render, 60000);
  </script>
</body>
</html>
