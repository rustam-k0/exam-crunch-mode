<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Tracker</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --glow-color: rgba(62, 102, 245, 0.08);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: #334155;
      background-image:
        radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.04), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.04), transparent 30%);
      background-attachment: fixed;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Light Theme Glassmorphic cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .glass-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.08);
    }

    /* Progress bar animation */
    #timeline-progress {
      transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fade in animation for cards */
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Status specific styles (Light Theme Adaptations) */
    .status-neutral {
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: #ffffff;
    }

    .status-high {
      border: 1px solid rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.04);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.05);
    }

    .status-medium {
      border: 1px solid rgba(234, 179, 8, 0.5);
      background: rgba(234, 179, 8, 0.04);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.05);
    }

    .status-low {
      border: 1px solid rgba(249, 115, 22, 0.4);
      background: rgba(249, 115, 22, 0.04);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.05);
    }

    .status-retake {
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.04);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.05);
    }

    .status-cancelled {
      border: 1px solid rgba(100, 116, 139, 0.2);
      background: rgba(241, 245, 249, 0.6);
      filter: grayscale(100%);
      opacity: 0.7;
      pointer-events: auto;
    }

    /* Text Colors for Light Theme */
    .glow-text-high {
      color: #059669;
    }

    .glow-text-medium {
      color: #d97706;
    }

    .glow-text-low {
      color: #ea580c;
    }

    .glow-text-retake {
      color: #dc2626;
    }

    .glow-text-cancelled {
      color: #64748b;
    }

    .glow-text-neutral {
      color: #94a3b8;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col selection:bg-emerald-600/20">

  <!-- Fixed Header -->
  <header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-white/70 border-b border-black/5 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex flex-col md:flex-row md:justify-between md:items-end gap-6">

        <!-- Branding -->
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-1 flex items-center gap-3">
            <span class="bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent">EXAMS</span>
          </h1>
          <p class="text-sm font-mono text-slate-500 uppercase tracking-widest" id="current-date">Loading...</p>
        </div>

        <!-- Master Timeline -->
        <div class="w-full md:w-1/2">
          <div class="flex justify-between items-center text-xs font-mono text-slate-400 mb-2 uppercase tracking-wide">
            <span>Mar 04</span>
            <span class="text-emerald-600 font-bold" id="timeline-percentage">0%</span>
            <span>May 04</span>
          </div>
          <div class="h-2 w-full bg-slate-200 rounded-full overflow-hidden border border-black/5 box-content">
            <div id="timeline-progress" class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full"
              style="width: 0%">
            </div>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow pt-36 pb-20 px-6">
    <div class="max-w-6xl mx-auto">

      <div class="flex justify-between items-end mb-8">
        <h2 class="text-xl font-medium text-slate-700">All Exams</h2>
        <div class="text-xs font-mono text-slate-400">Click a card to change its grade status</div>
      </div>

      <!-- Exam Grid -->
      <div id="exam-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Cards injected by JS -->
      </div>
    </div>
  </main>

  <script>
    // --- CONFIG & CONSTANTS ---
    const TIMELINE_START = new Date("2026-03-04T00:00:00");
    const TIMELINE_END = new Date("2026-05-04T23:59:59");
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    const STATUSES = ["neutral", "high", "medium", "low", "retake", "cancelled"];

    // Detailed Status Config mapping
    const STATUS_UI = {
      neutral: { label: "PENDING", ring: "status-neutral", textClass: "glow-text-neutral" },
      high: { label: "PASSED", ring: "status-high", textClass: "glow-text-high" },
      medium: { label: "MEDIUM", ring: "status-medium", textClass: "glow-text-medium" },
      low: { label: "LOW", ring: "status-low", textClass: "glow-text-low" },
      retake: { label: "FAILED", ring: "status-retake", textClass: "glow-text-retake" },
      cancelled: { label: "CANCELED", ring: "status-cancelled", textClass: "glow-text-cancelled" }
    };

    // --- MOCK DATA ---
    const EXAMS_DATA = [
      { id: "e1", code: "", name: "Prog. Methods & Tools 1", date: "2026-02-13T23:59:00", tags: [] },
      { id: "e2", code: "", name: "Programming 1", date: "2026-02-19T09:00:00", tags: [] },
      { id: "e3", code: "", name: "Algos & Data Structures", date: "2026-02-20T23:59:00", tags: [] },
      { id: "e4", code: "", name: "Business Admin 1", date: "2026-02-23T08:00:00", tags: [] },
      { id: "e5", code: "", name: "Database Systems", date: "2026-02-25T12:30:00", tags: [] },
      { id: "e6", code: "", name: "Math Basics of CS", date: "2026-02-27T08:00:00", tags: [] },
      { id: "e7", code: "", name: "Operating Systems", date: "2026-02-27T17:00:00", tags: [] },
      { id: "e8", code: "", name: "Digital Tech & Systems", date: "2026-03-02T13:30:00", tags: [] },
      { id: "e9", code: "", name: "HCI", date: "2026-03-04T11:00:00", tags: [] }
    ];

    // --- STATE MANAGEMENT ---
    function getExamStatus(examId) {
      return localStorage.getItem(`exam_status_${examId}`) || "neutral";
    }

    function cycleExamStatus(examId) {
      const current = getExamStatus(examId);
      const currentIndex = STATUSES.indexOf(current);
      const nextIndex = (currentIndex + 1) % STATUSES.length;
      localStorage.setItem(`exam_status_${examId}`, STATUSES[nextIndex]);
      renderApp();
    }

    // --- RENDER LOGIC ---
    function updateHeader(now) {
      const dateStr = now.toLocaleDateString('en-GB', {
        weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
      });
      const timeStr = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('current-date').innerText = `${dateStr} · ${timeStr} (Berlin)`;

      // Timeline Calculation
      const totalDuration = TIMELINE_END - TIMELINE_START;
      const elapsed = now - TIMELINE_START;

      let percent = (elapsed / totalDuration) * 100;
      percent = Math.max(0, Math.min(100, percent));

      document.getElementById('timeline-progress').style.width = `${percent}%`;
      document.getElementById('timeline-percentage').innerText = `${percent.toFixed(1)}%`;
    }

    function renderCards(now) {
      const grid = document.getElementById('exam-grid');
      grid.innerHTML = '';

      const sorted = [...EXAMS_DATA].sort((a, b) => new Date(a.date) - new Date(b.date));

      sorted.forEach((exam, index) => {
        const examDate = new Date(exam.date);
        const diffMs = examDate - now;

        let timeLabel = "";
        let timeValue = "";

        if (diffMs <= 0) {
          // Passed
          const daysPassed = Math.floor(Math.abs(diffMs) / MS_PER_DAY);
          timeLabel = "DAYS PASSED";
          timeValue = daysPassed.toString();
        } else {
          // Future -> Show "X days before" based on prompt
          const daysLeft = Math.ceil(diffMs / MS_PER_DAY);
          timeLabel = "DAYS BEFORE";
          timeValue = daysLeft.toString();
        }

        const status = getExamStatus(exam.id);
        const uiConfig = STATUS_UI[status];

        const dateFormatted = examDate.toLocaleString('en-GB', {
          weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
        });

        // Create Card Element
        const card = document.createElement('div');
        card.className = `glass-card p-5 cursor-pointer fade-in flex flex-col justify-between ${uiConfig.ring}`;
        card.style.animationDelay = `${index * 50}ms`;
        card.onclick = () => cycleExamStatus(exam.id);

        card.innerHTML = `
          <div class="pointer-events-none mb-6">
            <h3 class="text-lg font-semibold text-slate-800 leading-tight mb-1 mt-2">${exam.name}</h3>
            <p class="text-xs text-slate-500">${dateFormatted}</p>
          </div>

          <div class="pointer-events-none pt-4 border-t border-slate-200 flex items-end justify-between">
            <div>
              <div class="text-[9px] uppercase tracking-widest text-slate-400 mb-1 font-bold">${timeLabel}</div>
              <div class="text-3xl font-mono font-bold ${uiConfig.textClass}">
                ${timeValue}
              </div>
            </div>
            <div class="text-right">
              <span class="text-xs font-mono uppercase tracking-widest ${uiConfig.textClass} font-bold">
                ${uiConfig.label}
              </span>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function renderApp() {
      const now = new Date(); // Using local system time
      updateHeader(now);
      renderCards(now);
    }

    // --- INIT ---
    document.addEventListener("DOMContentLoaded", () => {
      renderApp();
      // Update the progress and time labels periodically
      setInterval(renderApp, 60000);
    });
  </script>
</body>

</html>
