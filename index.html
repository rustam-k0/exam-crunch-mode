<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f4f0">
  <title>Exam Board — Winter 2026/27</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%232563eb%22/></svg>">
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #17191f;
      --muted: #666b73;
      --line: #d9ddd5;
      --soft: #eef1ec;
      --soft-strong: #e5e9e2;
      --blue: #2563eb;
      --red: #e23f3f;
      --amber: #d99a00;
      --green: #199348;
      --shadow: 0 1px 2px rgba(23, 25, 31, .05);
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 12px 16px 8px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 40px;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      background: var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(37, 99, 235, .1);
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      display: none;
    }

    .clock {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .overview {
      display: grid;
      grid-template-columns: minmax(190px, 240px) minmax(360px, 1fr);
      align-items: center;
      gap: 20px;
      min-height: 50px;
      margin: 7px 0 7px;
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
    }

    .next {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .next strong {
      font-size: 24px;
      line-height: .95;
      white-space: nowrap;
    }

    .next span {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-wrap { min-width: 0; }

    .progress-copy {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-track {
      height: 6px;
      overflow: hidden;
      background: var(--soft);
      border-radius: 99px;
    }

    .progress-track.timeline {
      height: 64px;
      overflow: hidden;
      background: transparent;
      border-radius: 0;
    }

    .timeline-label {
      position: absolute;
      padding: 2px 5px;
      color: var(--text);
      background: rgba(255, 255, 255, .96);
      border: 1px solid #dfe3dc;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 750;
      line-height: 1.2;
      white-space: nowrap;
      z-index: 4;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--blue);
      border-radius: inherit;
      transition: width .3s ease;
    }

    .difficulty-legend { display: none; }

    .legend-item, .difficulty {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--difficulty);
    }

    .dot.hard, .difficulty.hard { --difficulty: var(--red); }
    .dot.medium, .difficulty.medium { --difficulty: var(--amber); }
    .dot.light, .difficulty.light { --difficulty: var(--green); }

    .section-head { display: none; }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      display: none;
    }

    .week-list {
      display: grid;
      gap: 6px;
    }

    .week-row {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .week-label {
      display: flex;
      justify-content: center;
      padding: 7px 6px;
      flex-direction: column;
      color: var(--muted);
      text-align: center;
    }

    .week-label strong {
      color: var(--text);
      font-size: 12px;
    }

    .week-label span {
      margin-top: 3px;
      font-size: 10px;
      line-height: 1.25;
    }

    .week-cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .subject-card {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 64px;
      padding: 7px 9px;
      flex-direction: column;
      color: inherit;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(23, 25, 31, .04);
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .subject-card[data-status="preparing"] { background: #fffdf6; border-color: #e2dccb; }
    .subject-card[data-status="ready"] { background: #f0faf4; border-color: #92cfa6; }
    .subject-card[data-status="waiting"] { background: #fffdf6; border-color: #e2dccb; }
    .subject-card[data-status="good"] { background: #f0faf4; border-color: #92cfa6; }
    .subject-card[data-status="average"] { background: #f4f7ff; border-color: #b8c6ee; }
    .subject-card[data-status="bad"] { background: #fff4f2; border-color: #eda8a1; }
    .subject-card[data-status="failed"] { background: #fee1e1; border-color: #ee8f8f; }
    .subject-card[data-status="cancelled"] { opacity: .58; }

    .mode-toggle {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      font-weight: 650;
      box-shadow: 0 1px 2px rgba(23, 25, 31, .04);
    }
    .mode-toggle:hover {
      background: var(--soft);
    }
    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: right;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .subject-title {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 6px;
    }

    .subject-title h3 {
      overflow: hidden;
      margin: 0;
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .state {
      flex: 0 0 auto;
      padding: 3px 6px;
      color: #5e636b;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(98, 105, 113, .14);
      border-radius: 6px;
      cursor: pointer;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .state:hover {
      color: var(--text);
      background: #ffffff;
      border-color: #c9cec6;
    }

    .state:focus-visible {
      outline: 2px solid rgba(37,99,235,.35);
      outline-offset: 2px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0 0 4px;
    }

    .tag {
      padding: 2px 6px;
      color: #545a62;
      background: rgba(255, 255, 255, .65);
      border: 1px solid rgba(98, 105, 113, .14);
      border-radius: 5px;
      font-size: 9px;
      line-height: 1.35;
    }

    .milestones {
      display: grid;
      gap: 2px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .milestone {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 6px;
      font-size: 10px;
      line-height: 1.22;
    }

    .milestone time {
      color: var(--text);
      font-weight: 750;
    }

    .milestone.result time {
      color: var(--muted);
      font-weight: 500;
    }

    .milestone-name {
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .countdown {
      color: var(--blue);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .milestone.result .countdown {
      color: var(--muted);
      font-weight: 500;
    }

    .notes {
      display: block;
      overflow: hidden;
      margin: 0;
      padding-top: 3px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note + .note::before {
      content: "·";
      margin-right: 8px;
      color: #b4b4ae;
    }

    .notes:empty { display: none; }

    .tomato {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 7px;
      box-shadow: 0 1px 2px rgba(23, 25, 31, .04);
    }

    .tomato-time {
      min-width: 40px;
      color: var(--red);
      font-size: 12px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .tomato button {
      width: 22px;
      height: 22px;
      padding: 0;
      color: var(--text);
      background: var(--soft);
      border: 1px solid rgba(98, 105, 113, .14);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .tomato button:hover { background: var(--soft-strong); }

    @media (max-width: 1080px) {
      .app { padding-inline: 18px; }
      .overview { grid-template-columns: minmax(190px, .7fr) minmax(220px, 1fr); }
      .week-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 880px) {
      .overview { grid-template-columns: 1fr; gap: 10px; }
      .week-row { grid-template-columns: 1fr; gap: 5px; }
      .week-label {
        align-items: baseline;
        justify-content: flex-start;
        padding: 6px 2px;
        flex-direction: row;
        gap: 7px;
        text-align: left;
      }
      .week-label span { margin-top: 0; }
      .week-cards {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: minmax(260px, 72vw);
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding-bottom: 3px;
        scroll-snap-type: x proximity;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }
      .subject-card { min-height: 92px; scroll-snap-align: start; }
    }

    @media (max-width: 560px) {
      .app { padding: 13px 12px 18px; }
      .topbar { align-items: flex-start; }
      .brand h1 { font-size: 20px; }
      .brand p { display: none; }
      .clock { max-width: 130px; font-size: 11px; }
      .topbar-controls { flex-wrap: wrap; justify-content: flex-end; }
      .overview { margin-top: 7px; padding: 10px; }
      .next strong { font-size: 24px; }
      .week-cards { grid-auto-columns: minmax(280px, 88vw); }
      .section-head { align-items: flex-start; flex-direction: column; gap: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
    .source-note { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .milestone small { font-size: 11px; }

    /* Compact semester board */
    :root { --bg: #f5f6f2; --line: #e1e5dc; --text: #20281f; --muted: #747b72; --blue: #466d52; }
    .app { width: min(1440px, 100%); padding: 16px 20px 24px; }
    .topbar { margin-bottom: 12px; }
    .brand h1 { letter-spacing: -.8px; font-size: 25px; }
    .brand p { display: block; margin: 6px 0 0; font-size: 11px; color: var(--muted); }
    .brand-mark { background: #90ab66; box-shadow: 0 0 0 5px #e7eddc; }
    .overview { grid-template-columns: 220px minmax(0, 1fr); padding: 12px 18px; min-height: 88px; gap: 24px; border-radius: 18px; box-shadow: 0 4px 18px #293b2410; }
    .next { flex-direction: column; gap: 9px; }
    .next strong { font-size: 30px; letter-spacing: -1px; }
    .next span { font-size: 11px; max-width: 100%; }
    .progress-copy { font-size: 10px; margin-bottom: 12px; }
    .progress-track.timeline { height: 52px; margin: 0 3px; }
    .month-tick { position: absolute; top: 12px; height: 12px; width: 1px; background: #d4ddcf; }
    .month-caption { position: absolute; top: 33px; font-size: 10px; color: var(--muted); white-space: nowrap; }
    .source-note { font-size: 10px; margin: 9px 2px 12px; }
    a { color: inherit; text-decoration-color: #b7c5b0; text-underline-offset: 3px; }
    a:hover { color: #396247; }
    .section-head { display: flex; margin: 0 0 8px; }
    .section-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
    .week-list { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .subject-card { padding: 11px 12px; border-radius: 11px; box-shadow: 0 2px 4px #26361e05; min-height: 0; }
    .subject-card:last-child { grid-column: auto; }
    .card-head { margin-bottom: 8px; gap: 7px; }
    .subject-title h3 { font-size: 13px; letter-spacing: -.3px; white-space: normal; }
    .difficulty { flex-shrink: 0; }
    .state { font-size: 9px; border-radius: 20px; padding: 4px 9px; }
    .tags { gap: 4px; margin-bottom: 8px; }
    .tag { font-size: 9px; padding: 2px 5px; border: 0; background: #f1f4ed; border-radius: 5px; }
    .milestones { gap: 6px; }
    .milestone { grid-template-columns: 50px minmax(0, 1fr) 35px; font-size: 11px; line-height: 1.5; }
    .milestone-name { white-space: normal; overflow: visible; }
    .milestone-name > a { font-weight: 600; text-decoration: none; color: var(--text); }
    .milestone-name > a:hover { text-decoration: underline; }
    .milestone small { display: inline-block; font-size: 10px; color: var(--muted); }
    .countdown { font-size: 10px; text-align: right; }
    .assessment-details { margin-top: 8px; border-top: 1px solid #edf0e8; padding-top: 6px; }
    .assessment-details summary { font-size: 10px; color: var(--muted); cursor: pointer; }
    .notes { white-space: normal; overflow: visible; font-size: 11px; line-height: 1.6; padding-top: 8px; }
    @media (min-width: 701px) and (max-width: 1050px) {
      .week-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .app { padding: 18px 14px 30px; }
      .topbar { align-items: flex-start; gap: 12px; }
      .topbar-controls { flex-wrap: wrap; justify-content: flex-end; }
      .clock { display: none; }
      .brand h1 { font-size: 21px; }
      .brand p { font-size: 9px; max-width: 150px; line-height: 1.5; }
      .overview { grid-template-columns: 1fr; padding: 18px; gap: 20px; }
      .next { flex-direction: row; align-items: center; gap: 14px; }
      .next strong { font-size: 32px; }
      .week-list { grid-template-columns: 1fr; }
      .subject-card:last-child { grid-column: auto; }
      .source-note { line-height: 1.6; }
      .month-caption { font-size: 9px; }
    }

    /* Read weeks chronologically from top to bottom. */
    .week-list { grid-template-columns: 1fr; gap: 9px; }
    .week-row { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: start; }
    .week-label { padding: 10px 0; text-align: left; }
    .week-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    @media (min-width: 701px) and (max-width: 1050px) {
      .week-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .week-row { grid-template-columns: 1fr; gap: 4px; }
      .week-label { flex-direction: row; gap: 8px; padding: 5px 0; }
      .week-cards { grid-template-columns: 1fr; grid-auto-flow: row; grid-auto-columns: auto; overflow: visible; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Exam Board</h1>
          <p>Winter semester 2026/27 · 7 modules · 43 ECTS · Berlin</p>
        </div>
      </div>
      <div class="topbar-controls">
        <div class="tomato" aria-label="Tomato timer">
          <span class="tomato-time" id="tomato-time">25:00</span>
          <button id="tomato-toggle" type="button" onclick="toggleTomato()" aria-label="Start tomato timer">▶</button>
          <button type="button" onclick="resetTomato()" aria-label="Reset tomato timer">↺</button>
        </div>
        <button id="mode-toggle" class="mode-toggle" onclick="toggleMode()">Mode: Prep</button>
        <time class="clock" id="current-time">Loading…</time>
      </div>
    </header>

    <section class="overview" aria-label="Exam overview">
      <div class="next">
        <strong id="next-count">—</strong>
        <span id="next-label">until the next deadline</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-copy"><span id="completion-copy">0 of 7 subjects complete</span><span id="run-copy">0% of exam period</span></div>
        <div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </section>

<p class="source-note">Verified with <a href="https://polli.bht-berlin.de/exams/B-MI/" target="_blank" rel="noopener noreferrer">BHT Polli</a> · 2 Nov 2026 · Exam dates in 2027 · Berlin time</p>
    <div class="section-head">
      <h2>Exams & assessments</h2>
    </div>
    <section class="week-list" id="week-list" aria-label="Assessments in chronological weeks"></section>
  </main>

    const MODE_PREP_STATES = ["todo", "preparing", "ready"];
    const MODE_PREP_LABELS = { todo: "Todo", preparing: "Prep", ready: "Ready" };
    const MODE_POST_STATES = ["waiting", "good", "average", "bad", "failed", "cancelled"];
    const MODE_POST_LABELS = { waiting: "Waiting", good: "Good", average: "Average", bad: "Bad", failed: "Failed", cancelled: "Cancelled" };
    

    let currentMode = localStorage.getItem("ws2026-27_mode") || "prep";
    let tomatoLeft = Number(localStorage.getItem("tomato_left")) || 25 * 60;
    let tomatoRunning = false;
    let tomatoTick = null;

    function getActiveStates() { return currentMode === "prep" ? MODE_PREP_STATES : MODE_POST_STATES; }
    function getActiveLabels() { return currentMode === "prep" ? MODE_PREP_LABELS : MODE_POST_LABELS; }

    function toggleMode() {
      currentMode = currentMode === "prep" ? "post" : "prep";
      localStorage.setItem("ws2026-27_mode", currentMode);
      render();
    }

    function renderTomato() {
      const minutes = String(Math.floor(tomatoLeft / 60)).padStart(2, "0");
      const seconds = String(tomatoLeft % 60).padStart(2, "0");
      document.getElementById("tomato-time").textContent = `${minutes}:${seconds}`;
      document.getElementById("tomato-toggle").textContent = tomatoRunning ? "Ⅱ" : "▶";
      document.getElementById("tomato-toggle").setAttribute("aria-label", tomatoRunning ? "Pause tomato timer" : "Start tomato timer");
    }

    function toggleTomato() {
      tomatoRunning = !tomatoRunning;
      if (tomatoRunning) {
        tomatoTick = setInterval(() => {
          tomatoLeft = Math.max(0, tomatoLeft - 1);
          localStorage.setItem("tomato_left", tomatoLeft);
          renderTomato();
          if (tomatoLeft === 0) {
            clearInterval(tomatoTick);
            tomatoRunning = false;
            renderTomato();
          }
        }, 1000);
      } else {
        clearInterval(tomatoTick);
      }
      renderTomato();
    }

    function resetTomato() {
      clearInterval(tomatoTick);
      tomatoRunning = false;
      tomatoLeft = 25 * 60;
      localStorage.setItem("tomato_left", tomatoLeft);
      renderTomato();
    }

    const DIFFICULTY_LABELS = { hard: "Hard", medium: "Medium", light: "Light" };
    const SHORT_FORMATS = {
      "Presentation + project": "Pres + proj",
      "Written exam + testat": "Exam + testat",
      "Written exam": "Exam",
      "Project + computer exam": "Proj + comp",
      "Project + written exam": "Proj + exam"
    };
    const SHORT_LABELS = {
      "Written exam": "Exam",
      "Portfolio deadline": "Portfolio",
      "Project deadline": "Project",
      "Submission & exam": "Submit + exam",
      "Project / Exposé": "Project"
    };
    const SHORT_NOTES = {
      "Results: late July": "Results late Jul",
      "Results: August": "Results Aug",
      "Results: late August": "Results late Aug",
      "Results: late September": "Results late Sep",
      "Cheat sheet allowed": "Sheet ok",
      "Cheat sheet on disk allowed": "Disk sheet ok",
      "No cheat sheet or exam bonus": "No sheet/bonus",
      "Testat 40% — full": "Testat 40%",
      "+0.6 grade bonus": "+0.6 bonus"
    };
    const DAY = 86400000;
    const PERIOD_START = parseDate("2026-11-02");
    const PERIOD_END = parseDate("2027-04-01");

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day, 12);
    }

    function daysFromNow(value, now) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
      return Math.ceil((parseDate(value) - today) / DAY);
    }

    function countdown(value, now) {
      const days = daysFromNow(value, now);
      if (days > 1) return `${days}d`;
      if (days === 1) return "Tomorrow";
      if (days === 0) return "Today";
      return `${Math.abs(days)}d ago`;
    }

    function dateLabel(value) {
      return parseDate(value).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
    }

    function mondayStart(date) {
      const monday = new Date(date);
      const day = (monday.getDay() + 6) % 7;
      monday.setDate(monday.getDate() - day);
      return new Date(monday.getFullYear(), monday.getMonth(), monday.getDate(), 12);
    }

    function weekId(value) {
      return mondayStart(parseDate(value)).toISOString().slice(0, 10);
    }

    function weekNumber(date) {
      const target = new Date(date);
      target.setHours(0, 0, 0, 0);
      target.setDate(target.getDate() + 3 - ((target.getDay() + 6) % 7));
      const week1 = new Date(target.getFullYear(), 0, 4);
      return 1 + Math.round(((target - week1) / DAY - 3 + ((week1.getDay() + 6) % 7)) / 7);
    }

    function compactRange(start) {
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      const startLabel = start.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      const endLabel = end.toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
      return `${startLabel}–${endLabel}`;
    }

    function getWeeks() {
      const starts = [...new Set(allEvents().map(event => weekId(event.date)))].sort();
      return starts.map(id => {
        const start = parseDate(id);
        return { id, label: `Week ${weekNumber(start)}`, range: compactRange(start) };
      });
    }

    function getStatus(id) {
      const activeStates = getActiveStates();
      let current = localStorage.getItem(`ws2026-27_${id}_${currentMode}`);
      if (!current && currentMode === "prep") {
        current = localStorage.getItem(`ws2026-27_${id}`);
        if (current === "working") current = "preparing";
        if (current === "passed" || current === "done") current = "ready";
      }
      return activeStates.includes(current) ? current : activeStates[0];
    }

    function cycleStatus(id) {
      const activeStates = getActiveStates();
      const current = getStatus(id);
      const next = activeStates[(activeStates.indexOf(current) + 1) % activeStates.length];
      localStorage.setItem(`ws2026-27_${id}_${currentMode}`, next);
      render();
    }

    function allEvents() {
      return SUBJECTS.flatMap(subject => subject.milestones.map(milestone => ({ ...milestone, subject: subject.name })))
        .sort((a, b) => parseDate(a.date) - parseDate(b.date));
    }

    function renderOverview(now) {
      const next = allEvents().find(event => daysFromNow(event.date, now) >= 0);
      const count = document.getElementById("next-count");
      const label = document.getElementById("next-label");

      if (next) {
        const days = daysFromNow(next.date, now);
        count.textContent = days === 0 ? "Today" : `${days}d`;
        label.textContent = `${next.subject} · ${SHORT_LABELS[next.label] || next.label}`;
      } else {
        count.textContent = "Done";
        label.textContent = "complete";
      }

      const done = SUBJECTS.filter(subject => {
        const s = getStatus(subject.id);
        return s === "ready" || s === "good" || s === "average" || s === "bad";
      }).length;
      const completion = Math.round((done / SUBJECTS.length) * 100);
      const elapsed = Math.max(0, Math.min(100, ((now - PERIOD_START) / (PERIOD_END - PERIOD_START)) * 100));
      const completionCopy = document.getElementById("completion-copy");
      const progressTrack = document.getElementById("progress-track");
      
      if (currentMode === "prep") {
        completionCopy.textContent = "Winter → Summer · 2026/27";
        
        const allEvs = allEvents();
        const examDates = new Set(allEvs.filter(e => e.label.toLowerCase().includes("exam")).map(e => parseDate(e.date).getTime()));
        const deadlineDates = new Set(allEvs.filter(e => !e.result && !e.label.toLowerCase().includes("results") && !e.label.toLowerCase().includes("exam")).map(e => parseDate(e.date).getTime()));
        const uniqueDateTimes = [...new Set([...examDates, ...deadlineDates])].sort((a,b) => a - b);
        
        const totalDuration = PERIOD_END - PERIOD_START;
        
        let trackHTML = `<div style="position: absolute; left: 0; right: 0; top: 16px; height: 5px; background: var(--soft); border-radius: 99px; z-index: 0;"></div>`;
        
        const months = ["2026-11-02", "2026-12-01", "2027-01-01", "2027-02-01", "2027-03-01", "2027-04-01"];
        months.forEach((value, index) => {
          const pct = ((parseDate(value) - PERIOD_START) / totalDuration) * 100;
          const caption = index === 0 ? "02 Nov" : index === months.length - 1 ? "01 Apr · Summer" : parseDate(value).toLocaleDateString("en-GB", { month: "short" });
          const transform = index === 0 ? "none" : index === months.length - 1 ? "translateX(-100%)" : "translateX(-50%)";
          trackHTML += `<span class="month-tick" style="left:${pct}%"></span><span class="month-caption" style="left:${pct}%;transform:${transform}">${caption}</span>`;
        });

        let lastLabelPct = -100;
        uniqueDateTimes.forEach(t => {
           let pct = ((t - PERIOD_START) / totalDuration) * 100;
           pct = Math.max(0, Math.min(100, pct));
           const isExam = examDates.has(t);
           const color = t < now ? "#626973" : (isExam ? "var(--blue)" : "var(--amber)");
           const dotSize = isExam ? "7px" : "5px";
           const title = new Date(t).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
           const labelTransform = pct > 96 ? "translateX(-100%)" : (pct < 4 ? "translateX(0)" : "translateX(-50%)");
           const showLabel = false;
           
           trackHTML += `<div title="${title}" style="position: absolute; left: ${pct}%; top: 18px; height: ${dotSize}; width: ${dotSize}; background: ${color}; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(23,25,31,.08); border-radius: 999px; transform: translate(-50%, -50%); z-index: 3;"></div>`;
           if (showLabel) {
             trackHTML += `<div class="timeline-label" style="left: ${pct}%; top: 34px; transform: ${labelTransform};">${title}</div>`;
             lastLabelPct = pct;
           }
        });
        
        let todayPct = ((now - PERIOD_START) / totalDuration) * 100;
        todayPct = Math.max(0, Math.min(100, todayPct));
        
        // Shaded bar for elapsed time
        trackHTML += `<div style="position: absolute; left: 0; top: 16px; height: 5px; width: ${todayPct}%; background: rgba(226, 63, 63, 0.16); border-radius: 99px; z-index: 2;"></div>`;
        
        if (todayPct >= 0 && todayPct <= 100) {
           trackHTML += `<div style="position: absolute; left: ${todayPct}%; top: 10px; height: 16px; width: 2px; background: var(--text); transform: translateX(-50%); z-index: 4; border-radius: 2px;" title="Today"></div>`;
        }
        
        progressTrack.innerHTML = trackHTML;
        progressTrack.classList.add("timeline");
        progressTrack.style.position = "relative";
        progressTrack.style.overflow = "visible";
        document.querySelector(".progress-wrap").style.margin = "0";
      } else {
        completionCopy.textContent = `${done}/${SUBJECTS.length} done`;
        progressTrack.innerHTML = `<div class="progress-fill" id="progress-fill" style="width: ${completion}%"></div>`;
        progressTrack.classList.remove("timeline");
        progressTrack.style.position = "relative";
        progressTrack.style.overflow = "visible";
        document.querySelector(".progress-wrap").style.margin = "0";
      }
      
      document.getElementById("run-copy").textContent = `${Math.round(elapsed)}%`;
    }

    function renderCards(now) {
      const list = document.getElementById("week-list");
      list.innerHTML = "";
      const renderedSubjects = new Set();

      getWeeks().forEach(week => {
        const row = document.createElement("section");
        row.className = "week-row";
        row.setAttribute("aria-labelledby", `week-${week.id}`);
        
        let hasCards = false;
        
        row.innerHTML = `
          <div class="week-label" id="week-${week.id}">
            <strong>${week.label}</strong><span>${week.range}</span>
          </div>
          <div class="week-cards"></div>`;
        const cards = row.querySelector(".week-cards");

        [...SUBJECTS].sort((a, b) => a.milestones[0].date.localeCompare(b.milestones[0].date)).forEach(subject => {
          if (renderedSubjects.has(subject.id)) return;
          
          const examMilestone = subject.milestones.find(m => m.label.toLowerCase().includes("exam"));
          const placementDate = examMilestone ? examMilestone.date : subject.milestones.map(m => m.date).sort()[0];
          const subjectFirstWeek = weekId(placementDate);
          if (subjectFirstWeek !== week.id) return;
          
          renderedSubjects.add(subject.id);
          hasCards = true;

          const activeLabels = getActiveLabels();
          const status = getStatus(subject.id);
          const card = document.createElement("article");
          card.className = "subject-card";
          card.dataset.status = status;
          card.setAttribute("aria-label", `${subject.name}, ${week.label}. Status: ${activeLabels[status]}.`);

          const milestones = subject.milestones.map(milestone => `
            <li class="milestone ${milestone.result ? 'result' : ''}">
              <time datetime="${milestone.date}">${dateLabel(milestone.date)}</time>
              <span class="milestone-name">${milestone.source ? `<a href="${milestone.source}" target="_blank" rel="noopener noreferrer">${SHORT_LABELS[milestone.label] || milestone.label}</a>` : (SHORT_LABELS[milestone.label] || milestone.label)}<br><small>${milestone.time || "Time TBA"} · ${milestone.room || "Room TBA"}</small></span>
              <span class="countdown">${countdown(milestone.date, now)}</span>
            </li>`).join("");
          const subjectNotes = [...new Set([...(subject.notes || []), ...subject.milestones.flatMap(milestone => milestone.notes || [])])];
          const notes = subjectNotes.map(note => `<span class="note">${SHORT_NOTES[note] || note}</span>`).join("");

          card.innerHTML = `
            <div class="card-head">
              <div class="subject-title">
                <span class="difficulty ${subject.difficulty}" title="${DIFFICULTY_LABELS[subject.difficulty]}"><i class="dot"></i></span>
                <h3>${subject.name}</h3>
              </div>
              <button class="state" type="button" title="Change status" aria-label="Change ${subject.name} status from ${activeLabels[status]}">${activeLabels[status]}</button>
            </div>
            <div class="tags"><span class="tag">${subject.required}</span><span class="tag">${SHORT_FORMATS[subject.format] || subject.format}</span></div>
            <ul class="milestones">${milestones}</ul>
            <details class="assessment-details"><summary>Assessment details</summary><div class="notes">${notes}</div></details>`;
          card.querySelector(".state").addEventListener("click", () => cycleStatus(subject.id));
          cards.appendChild(card);
        });
        
        if (hasCards) {
          list.appendChild(row);
        }
      });
    }

    function render() {
      const now = new Date();
      document.getElementById("mode-toggle").textContent = currentMode === "prep" ? "Prep" : "Post";
      document.getElementById("current-time").textContent = now.toLocaleString("en-GB", {
        weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin"
      }) + " · Berlin";
      renderOverview(now);
      renderCards(now);
      renderTomato();
    }

    render();
    setInterval(render, 60000);
  </script>
