<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Result Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --glow-color: rgba(62, 102, 245, 0.15);
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: #e2e8f0;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
      background-attachment: fixed;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Glassmorphic cards */
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glass-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
    }

    /* Progress bar animation */
    #timeline-progress {
      transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Fade in animation for cards */
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Status specific styles */
    .status-neutral { border: 1px solid rgba(255,255,255,0.08); }
    .status-high { border: 1px solid rgba(16, 185, 129, 0.5); background: rgba(16, 185, 129, 0.08); box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
    .status-medium { border: 1px solid rgba(234, 179, 8, 0.5); background: rgba(234, 179, 8, 0.08); box-shadow: 0 0 20px rgba(234, 179, 8, 0.1); }
    .status-low { border: 1px solid rgba(249, 115, 22, 0.5); background: rgba(249, 115, 22, 0.08); box-shadow: 0 0 20px rgba(249, 115, 22, 0.1); }
    .status-retake { border: 1px solid rgba(239, 68, 68, 0.5); background: rgba(239, 68, 68, 0.08); box-shadow: 0 0 20px rgba(239, 68, 68, 0.1); }
    .status-cancelled { border: 1px solid rgba(100, 116, 139, 0.3); background: rgba(15, 23, 42, 0.4); filter: grayscale(100%); opacity: 0.6; pointer-events: auto; }

    .glow-text-high { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.4); }
    .glow-text-medium { color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.4); }
    .glow-text-low { color: #fb923c; text-shadow: 0 0 10px rgba(251, 146, 60, 0.4); }
    .glow-text-retake { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.4); }
    .glow-text-cancelled { color: #94a3b8; }
    .glow-text-neutral { color: #cbd5e1; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>

<body class="min-h-screen flex flex-col selection:bg-blue-600/30">

  <!-- Fixed Header -->
  <header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-[#050505]/70 border-b border-white/5">
    <div class="max-w-6xl mx-auto px-6 py-5">
      <div class="flex flex-col md:flex-row md:justify-between md:items-end gap-6">
        
        <!-- Branding -->
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-white mb-1 flex items-center gap-3">
            <span class="bg-gradient-to-r from-blue-400 to-violet-400 bg-clip-text text-transparent">Result Tracker</span>
          </h1>
          <p class="text-sm font-mono text-slate-400 uppercase tracking-widest" id="current-date">Loading...</p>
        </div>

        <!-- Master Timeline -->
        <div class="w-full md:w-1/2">
          <div class="flex justify-between items-center text-xs font-mono text-slate-500 mb-2 uppercase tracking-wide">
            <span>Mar 04</span>
            <span class="text-blue-400 font-bold" id="timeline-percentage">0%</span>
            <span>Aug 04</span>
          </div>
          <div class="h-2 w-full bg-slate-800/50 rounded-full overflow-hidden border border-white/5 box-content">
            <div id="timeline-progress" class="h-full bg-gradient-to-r from-blue-500 via-indigo-500 to-violet-500 rounded-full" style="width: 0%"></div>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-grow pt-36 pb-20 px-6">
    <div class="max-w-6xl mx-auto">
      
      <div class="flex justify-between items-end mb-8">
        <h2 class="text-xl font-medium text-slate-300">Your Exams Archive</h2>
        <div class="text-xs font-mono text-slate-500">Click a card to change its grade status</div>
      </div>

      <!-- Exam Grid -->
      <div id="exam-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <!-- Cards injected by JS -->
      </div>
    </div>
  </main>

  <script>
    // --- CONFIG & CONSTANTS ---
    const TIMELINE_START = new Date("2026-03-04T00:00:00");
    const TIMELINE_END = new Date("2026-08-04T23:59:59");
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    const STATUSES = ["neutral", "high", "medium", "low", "retake", "cancelled"];
    
    // Detailed Status Config mapping
    const STATUS_UI = {
      neutral: { label: "Awaiting Result", ring: "status-neutral", textClass: "glow-text-neutral" },
      high: { label: "High Grade", ring: "status-high", textClass: "glow-text-high" },
      medium: { label: "Medium Grade", ring: "status-medium", textClass: "glow-text-medium" },
      low: { label: "Low Grade", ring: "status-low", textClass: "glow-text-low" },
      retake: { label: "Retake Needed", ring: "status-retake", textClass: "glow-text-retake" },
      cancelled: { label: "Cancelled", ring: "status-cancelled", textClass: "glow-text-cancelled" }
    };

    // --- MOCK DATA ---
    const EXAMS_DATA = [
      { id: "e1", code: "MAT201", name: "Advanced Mathematics", date: "2026-03-12T09:00:00" },
      { id: "e2", code: "PHY102", name: "Physics II Mechanics", date: "2026-03-25T14:00:00" },
      { id: "e3", code: "CS301", name: "Computer Vision", date: "2026-04-10T11:00:00" },
      { id: "e4", code: "CS305", name: "Web Engineering", date: "2026-05-02T13:30:00" },
      { id: "e5", code: "DS400", name: "Machine Learning", date: "2026-05-28T10:00:00" },
      { id: "e6", code: "PHL101", name: "Modern Philosophy", date: "2026-06-15T15:00:00" },
      { id: "e7", code: "ENG202", name: "Technical Writing", date: "2026-06-25T09:00:00" },
      { id: "e8", code: "THE500", name: "Thesis Defense", date: "2026-07-20T10:00:00" }
    ];

    // --- STATE MANAGEMENT ---
    function getExamStatus(examId) {
      return localStorage.getItem(`exam_status_${examId}`) || "neutral";
    }

    function cycleExamStatus(examId) {
      const current = getExamStatus(examId);
      const currentIndex = STATUSES.indexOf(current);
      const nextIndex = (currentIndex + 1) % STATUSES.length;
      localStorage.setItem(`exam_status_${examId}`, STATUSES[nextIndex]);
      renderApp();
    }

    // --- RENDER LOGIC ---
    function updateHeader(now) {
      const dateStr = now.toLocaleDateString('en-GB', { 
        weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' 
      });
      document.getElementById('current-date').innerText = dateStr;

      // Timeline Calculation
      const totalDuration = TIMELINE_END - TIMELINE_START;
      const elapsed = now - TIMELINE_START;
      
      let percent = (elapsed / totalDuration) * 100;
      percent = Math.max(0, Math.min(100, percent));
      
      document.getElementById('timeline-progress').style.width = `${percent}%`;
      document.getElementById('timeline-percentage').innerText = `${percent.toFixed(1)}%`;
    }

    function renderCards(now) {
      const grid = document.getElementById('exam-grid');
      grid.innerHTML = '';

      const sorted = [...EXAMS_DATA].sort((a, b) => new Date(a.date) - new Date(b.date));

      sorted.forEach((exam, index) => {
        const examDate = new Date(exam.date);
        const diffMs = now - examDate;
        
        let timeLabel = "";
        let timeValue = "";
        
        if (diffMs >= 0) {
          // Passed
          const daysPassed = Math.floor(diffMs / MS_PER_DAY);
          timeLabel = "DAYS PASSED";
          timeValue = daysPassed.toString();
        } else {
          // Future
          const daysLeft = Math.ceil(Math.abs(diffMs) / MS_PER_DAY);
          timeLabel = "IN DAYS";
          timeValue = daysLeft.toString();
        }

        const status = getExamStatus(exam.id);
        const uiConfig = STATUS_UI[status];

        const dateFormatted = examDate.toLocaleString('en-GB', { 
          day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' 
        });

        // Create Card Element
        const card = document.createElement('div');
        card.className = `glass-card p-5 cursor-pointer fade-in flex flex-col justify-between ${uiConfig.ring}`;
        card.style.animationDelay = `${index * 60}ms`;
        card.onclick = () => cycleExamStatus(exam.id);

        card.innerHTML = `
          <div class="pointer-events-none mb-6">
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-mono font-bold bg-white/10 px-2 py-1 rounded text-slate-300 tracking-wider">
                ${exam.code}
              </span>
              <span class="text-[10px] font-mono uppercase tracking-widest ${uiConfig.textClass} font-bold px-2 py-1 border border-current rounded-full">
                ${uiConfig.label}
              </span>
            </div>
            <h3 class="text-lg font-medium text-white leading-tight mb-1">${exam.name}</h3>
            <p class="text-xs text-slate-500">${dateFormatted}</p>
          </div>

          <div class="pointer-events-none pt-4 border-t border-white/5 flex items-end justify-between">
            <div>
              <div class="text-[9px] uppercase tracking-widest text-slate-500 mb-1">${timeLabel}</div>
              <div class="text-3xl font-mono font-bold ${diffMs >= 0 ? uiConfig.textClass : 'text-slate-400'}">
                ${timeValue}
              </div>
            </div>
            ${status === 'cancelled' ? `
              <div class="text-2xl opacity-50">❌</div>
            ` : `
              <div class="text-xl ${uiConfig.textClass} opacity-80">
                ${status === 'high' ? '🏆' : status === 'medium' ? '⚡' : status === 'low' ? '⚠️' : status === 'retake' ? '🔄' : '⏱'}
              </div>
            `}
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    function renderApp() {
      const now = new Date(); // Using local system time
      updateHeader(now);
      renderCards(now);
    }

    // --- INIT ---
    document.addEventListener("DOMContentLoaded", () => {
      renderApp();
      // Update the progress and time labels periodically
      setInterval(renderApp, 60000); 
    });
  </script>
</body>
</html>
